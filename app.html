<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Machine Bike Shop — Notas</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaf0; --muted:#9aa3b2; --accent:#e11d2a; --accent2:#f5a623;
    --green:#22c55e; --blue:#3b82f6; --amber:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  header{background:linear-gradient(90deg,#000,#1a1a1a);border-bottom:2px solid var(--accent);padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
  header .logo{width:44px;height:44px;display:flex;align-items:center;justify-content:center;line-height:0}
  header h1{font-size:18px;margin:0}
  header small{color:var(--muted);display:block;font-weight:400}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tabs button{background:var(--panel);color:var(--muted);border:1px solid var(--line);padding:10px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
  .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card .v{font-size:24px;font-weight:800;margin-top:4px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px}
  .panel h2{margin:0 0 14px;font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 10px;border-radius:7px;font-size:14px;font-family:inherit}
  textarea{resize:vertical;min-height:60px}
  .up{text-transform:uppercase}
  input.up::placeholder,textarea.up::placeholder{text-transform:none}
  .items-table{width:100%;border-collapse:collapse;margin-top:8px}
  .items-table th,.items-table td{border:1px solid var(--line);padding:6px;font-size:13px;text-align:left}
  .items-table th{background:var(--panel2);color:var(--muted)}
  .items-table input{padding:6px}
  .btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px}
  .btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .btn.sm{padding:6px 10px;font-size:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input,.toolbar select{width:auto;flex:1;min-width:140px}
  .note-list{display:flex;flex-direction:column;gap:10px}
  .note{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .note .meta{font-size:13px;color:var(--muted)}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
  .badge.venta{background:rgba(34,197,94,.15);color:var(--green)}
  .badge.apartado{background:rgba(245,158,11,.15);color:var(--amber)}
  .badge.taller{background:rgba(59,130,246,.15);color:var(--blue)}
  .badge.pagado{background:rgba(34,197,94,.15);color:var(--green)}
  .badge.pendiente{background:rgba(245,158,11,.15);color:var(--amber)}
  .badge.entregado{background:rgba(34,197,94,.15);color:var(--green)}
  .badge.proceso{background:rgba(59,130,246,.15);color:var(--blue)}
  .amt{font-size:20px;font-weight:800}
  .muted{color:var(--muted)}
  .total-line{text-align:right;font-size:18px;font-weight:800;margin-top:10px}
  .hidden{display:none!important}
  .empty{text-align:center;color:var(--muted);padding:30px}
  dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:12px;max-width:760px;width:94%;padding:0}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .dlg-body{padding:18px}
  .dlg-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding:0 18px 18px}
  #ask{max-width:400px}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;border:1px solid var(--line);padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:100}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ---- Login ---- */
  #auth{position:fixed;inset:0;background:linear-gradient(160deg,#0a0a0a,#1a1a1a);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
  #auth .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px;width:100%;max-width:360px;text-align:center}
  #auth .box h2{margin:16px 0 4px;font-size:18px}
  #auth .box p{color:var(--muted);font-size:13px;margin:0 0 20px}
  #auth .box label{text-align:left}
  #auth .box input{margin-bottom:12px}
  #auth .box .btn{width:100%;margin-top:6px;padding:12px}
  #auth .err{color:#ef4444;font-size:13px;min-height:18px;margin-top:10px}
  /* ---- Recibo / PDF ---- */
  .receipt{background:#fff;color:#1a1a1a;border-radius:8px;padding:26px 30px;font-size:13px}
  .receipt .r-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1a1a1a;padding-bottom:14px}
  .receipt .r-brand{display:flex;gap:12px;align-items:center}
  .receipt .r-brand .r-name{font-weight:800;font-size:18px;letter-spacing:.5px;line-height:1.1}
  .receipt .r-brand .r-sub{font-size:11px;color:#555;max-width:240px;margin-top:3px}
  .receipt .r-doc{text-align:right}
  .receipt .r-doc .r-type{font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:1px}
  .receipt .r-doc .r-folio{font-size:22px;font-weight:800}
  .receipt .r-doc .r-date{font-size:11px;color:#555}
  .receipt .r-info{display:flex;justify-content:space-between;gap:20px;margin:16px 0;font-size:12px}
  .receipt .r-info b{display:block;color:#666;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
  .receipt table.r-items{width:100%;border-collapse:collapse;margin-top:6px}
  .receipt table.r-items th{background:#1a1a1a;color:#fff;padding:8px 10px;font-size:11px;text-align:left;text-transform:uppercase;letter-spacing:.5px}
  .receipt table.r-items th.num,.receipt table.r-items td.num{text-align:right}
  .receipt table.r-items td{padding:8px 10px;border-bottom:1px solid #e2e2e2}
  .receipt .r-totals{margin-top:14px;margin-left:auto;width:260px;font-size:13px}
  .receipt .r-totals div{display:flex;justify-content:space-between;padding:5px 0}
  .receipt .r-totals .r-grand{border-top:2px solid #1a1a1a;font-weight:800;font-size:16px;padding-top:8px}
  .receipt .r-totals .r-saldo{color:#c0392b;font-weight:800}
  .receipt .r-foot{margin-top:26px;border-top:1px solid #ddd;padding-top:12px;font-size:11px;color:#666;display:flex;justify-content:space-between;gap:30px}
  .receipt .r-sign{margin-top:34px;text-align:center;flex:1}
  .receipt .r-sign .line{border-top:1px solid #1a1a1a;padding-top:5px}
  #printArea{display:none}
  @media print{
    @page{margin:14mm}
    body{background:#fff;color:#000}
    body>*{display:none!important}
    #printArea{display:block!important;padding:0;background:#fff}
    .no-print{display:none!important}
  }
</style>
</head>
<body>
<!-- Pantalla de acceso (solo en modo nube) -->
<div id="auth" class="hidden">
  <div class="box">
    <span id="authLogo" style="line-height:0"></span>
    <h2>Black Machine Bike Shop</h2>
    <p>Sistema de notas</p>
    <label>Correo</label>
    <input id="authEmail" type="email" placeholder="correo@ejemplo.com" autocomplete="username">
    <label>Contraseña</label>
    <input id="authPass" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="authBtn">Entrar</button>
    <div class="err" id="authErr"></div>
  </div>
</div>

<header>
  <span class="logo" id="brandLogo"></span>
  <div style="flex:1">
    <h1>Black Machine Bike Shop</h1>
    <small id="hSub"></small>
  </div>
  <button class="btn sec sm no-print" id="btnConfig">⚙ Tienda</button>
  <button class="btn sec sm no-print hidden" id="btnLogout">Salir</button>
</header>

<div class="wrap">
  <div class="tabs">
    <button data-view="dashboard" class="active">Panel</button>
    <button data-view="nueva">Nueva nota</button>
    <button data-view="lista">Notas registradas</button>
    <button data-view="clientes">Clientes</button>
  </div>

  <!-- DASHBOARD -->
  <div id="view-dashboard">
    <div class="cards">
      <div class="card"><div class="k">Ventas del mes</div><div class="v" id="stVentasMes">$0</div><div class="k" id="stMesNombre" style="margin-top:4px"></div></div>
      <div class="card"><div class="k">Ventas totales</div><div class="v" id="stVentas">$0</div></div>
      <div class="card"><div class="k">Apartados (saldo)</div><div class="v" id="stApartados">$0</div></div>
      <div class="card"><div class="k">Taller pendiente</div><div class="v" id="stTaller">0</div></div>
      <div class="card"><div class="k">Total notas</div><div class="v" id="stTotal">0</div></div>
    </div>
    <div class="panel">
      <h2>Últimas notas</h2>
      <div class="note-list" id="recientes"></div>
    </div>
  </div>

  <!-- NUEVA NOTA -->
  <div id="view-nueva" class="hidden">
    <div class="panel">
      <h2>Registrar nueva nota</h2>
      <div class="grid">
        <div>
          <label>Tipo de nota</label>
          <select id="fTipo">
            <option value="venta">Venta</option>
            <option value="apartado">Apartado</option>
            <option value="taller">Taller</option>
          </select>
        </div>
        <div><label>Fecha</label><input type="date" id="fFecha"></div>
        <div><label>Cliente</label><input id="fCliente" class="up" list="clienteList" placeholder="Nombre del cliente"><datalist id="clienteList"></datalist></div>
        <div><label>WhatsApp del cliente</label><input id="fWa" placeholder="Opcional"></div>
        <div><label>Domicilio del cliente</label><input id="fDomicilio" class="up" placeholder="Opcional"></div>
        <div><label>Método de pago</label>
          <select id="fPago"></select>
        </div>
      </div>

      <!-- Campos específicos taller -->
      <div id="grpTaller" class="grid hidden" style="margin-top:12px">
        <div><label>Bicicleta / Modelo</label><input id="fBici" class="up" placeholder="Marca y modelo"></div>
        <div><label>Rodado</label><input id="fRodado" class="up" placeholder="Ej. 20, 24, 26, 27.5, 29"></div>
        <div><label>Estado</label>
          <select id="fEstado">
            <option value="proceso">En proceso</option>
            <option value="entregado">Entregado</option>
          </select>
        </div>
        <div style="grid-column:1/-1"><label>Detalles / Estado físico (¿trae rayones, golpes, accesorios?)</label><textarea id="fDetalles" class="up" placeholder="Describe si la bicicleta trae detalles al recibirla"></textarea></div>
        <div style="grid-column:1/-1"><label>Diagnóstico / Trabajo a realizar</label><textarea id="fDiag" class="up" placeholder="Descripción del servicio"></textarea></div>
      </div>

      <h2 style="margin-top:18px">Conceptos</h2>
      <table class="items-table">
        <thead><tr><th style="width:50%">Descripción</th><th>Cant.</th><th>Precio unit.</th><th>Importe</th><th></th></tr></thead>
        <tbody id="itemsBody"></tbody>
      </table>
      <div class="row"><button class="btn sec sm" id="addItem">+ Agregar concepto</button></div>

      <!-- Pago apartado -->
      <div id="grpApartado" class="grid hidden" style="margin-top:14px">
        <div><label>Anticipo / Abono</label><input type="number" id="fAnticipo" value="0" min="0" step="0.01"></div>
      </div>

      <div class="total-line">Total: <span id="totalPreview">$0.00</span></div>
      <div id="saldoLine" class="total-line hidden">Saldo pendiente: <span id="saldoPreview">$0.00</span></div>

      <div style="margin-top:12px"><label>Notas / Observaciones</label><textarea id="fObs" class="up"></textarea></div>

      <div class="row">
        <button class="btn" id="guardar">Guardar nota</button>
        <button class="btn sec" id="limpiar">Limpiar</button>
      </div>
    </div>
  </div>

  <!-- CLIENTES -->
  <div id="view-clientes" class="hidden">
    <div class="toolbar">
      <input id="buscarCli" placeholder="Buscar cliente por nombre o WhatsApp...">
    </div>
    <div class="note-list" id="listaClientes"></div>
  </div>

  <!-- LISTA -->
  <div id="view-lista" class="hidden">
    <div class="toolbar">
      <input id="buscar" placeholder="Buscar por cliente, folio o concepto...">
      <select id="filtroTipo">
        <option value="">Todos los tipos</option>
        <option value="venta">Venta</option>
        <option value="apartado">Apartado</option>
        <option value="taller">Taller</option>
      </select>
      <button class="btn sec" id="exportar">Exportar CSV</button>
    </div>
    <div class="note-list" id="listaNotas"></div>
  </div>
</div>

<!-- Detalle -->
<dialog id="dlg">
  <div class="dlg-body"><div class="receipt" id="dlgBody"></div></div>
  <div class="dlg-actions" id="dlgActions"></div>
</dialog>
<dialog id="ask"></dialog>
<div id="printArea" class="receipt"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
/* =========================================================
   CONFIGURACIÓN DE LA NUBE (Supabase)
   Pega aquí los 2 datos de tu proyecto (Settings > API).
   Mientras estén vacíos, la app funciona en modo LOCAL
   (los datos se guardan solo en este dispositivo).
   ========================================================= */
const CFG={
  url:'https://mymoaywrliiclvvffqun.supabase.co',   // Project URL
  key:'sb_publishable_dpFoocifr19fA5KcxSzznA_QgIC7E3J'  // clave publishable (pública, segura para el navegador)
};
const CLOUD=!!(CFG.url&&CFG.key&&window.supabase);
const sb=CLOUD?window.supabase.createClient(CFG.url,CFG.key):null;

const KEY='bm_notas_v1';
const CKEY='bm_config_v1';
const TIENDA=Object.assign({
  nombre:'Black Machine Bike Shop',
  dir:'Av. Tesistán 704A, San José del Bajío, Zapopan, Jalisco. CP 45140',
  tel:'',
  whatsapp:'3325899142'
},JSON.parse(localStorage.getItem(CKEY)||'{}'));
function saveConfig(){localStorage.setItem(CKEY,JSON.stringify({tel:TIENDA.tel,whatsapp:TIENDA.whatsapp}));}
const waLink=num=>num?('https://wa.me/'+num.replace(/[^0-9]/g,'')):'';
const PAGOS=['Efectivo','Tarjeta','Transferencia','Depósito','Mixto'];
const digits=s=>(s||'').replace(/\D/g,'');
// Mayúsculas automáticas en los campos marcados con clase "up"
document.addEventListener('input',e=>{
  if(e.target.classList&&e.target.classList.contains('up')){
    const p=e.target.selectionStart;
    e.target.value=e.target.value.toUpperCase();
    try{e.target.setSelectionRange(p,p);}catch(_){}
  }
});
// --- Diálogos propios (funcionan dentro del visor web, sin prompt/alert/confirm) ---
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400);
}
function askInput({title,label,value='',type='text',ok='Aceptar'}){
  return new Promise(res=>{
    const d=document.getElementById('ask');
    d.innerHTML=`<div class="dlg-body"><h2 style="margin:0 0 12px;font-size:16px">${title}</h2>
      <label>${label}</label><input id="askInp" type="${type}" value="${value}" ${type==='number'?'step="0.01" min="0"':''}>
      <div class="row" style="justify-content:flex-end;margin-top:16px">
        <button class="btn sec sm" value="cancel" id="askCancel">Cancelar</button>
        <button class="btn sm" id="askOk">${ok}</button></div></div>`;
    d.showModal();
    const inp=d.querySelector('#askInp');inp.focus();try{inp.select();}catch(e){}
    const done=v=>{d.close();res(v);};
    d.querySelector('#askOk').onclick=()=>done(inp.value);
    d.querySelector('#askCancel').onclick=()=>done(null);
    inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value);};
  });
}
function confirmModal(msg){
  return new Promise(res=>{
    const d=document.getElementById('ask');
    d.innerHTML=`<div class="dlg-body"><p style="margin:0 0 16px">${msg}</p>
      <div class="row" style="justify-content:flex-end">
        <button class="btn sec sm" id="cNo">Cancelar</button>
        <button class="btn sm" id="cYes">Aceptar</button></div></div>`;
    d.showModal();
    d.querySelector('#cYes').onclick=()=>{d.close();res(true);};
    d.querySelector('#cNo').onclick=()=>{d.close();res(false);};
  });
}
// Logo vectorial (robot con eslabón de cadena). ink = trazo, paper = fondo interno.
function logoMark(ink,paper,size){
  return `<svg viewBox="0 0 220 210" width="${size}" height="${size*210/220}" xmlns="http://www.w3.org/2000/svg" aria-label="Black Machine">
    <g fill="${ink}">
      <!-- antena central con esfera -->
      <circle cx="110" cy="16" r="13"/>
      <rect x="106" y="16" width="8" height="40"/>
      <!-- dos tabs cuadrados superiores -->
      <rect x="74" y="34" width="20" height="24" rx="3"/>
      <rect x="126" y="34" width="20" height="24" rx="3"/>
      <!-- orejas laterales -->
      <rect x="20" y="92" width="24" height="58" rx="12"/>
      <rect x="176" y="92" width="24" height="58" rx="12"/>
      <!-- cuerpo/cabeza -->
      <rect x="38" y="52" width="144" height="140" rx="32"/>
    </g>
    <!-- pantalla -->
    <rect x="66" y="76" width="88" height="94" rx="18" fill="${paper}"/>
    <!-- eslabon de cadena: union de dos circulos (placa) -->
    <g fill="${ink}">
      <circle cx="92" cy="123" r="24"/>
      <circle cx="128" cy="123" r="24"/>
      <rect x="92" y="105" width="36" height="36" rx="18"/>
    </g>
    <circle cx="92" cy="123" r="12.5" fill="${paper}"/>
    <circle cx="128" cy="123" r="12.5" fill="${paper}"/>
    <g fill="${ink}"><circle cx="92" cy="123" r="5.5"/><circle cx="128" cy="123" r="5.5"/></g>
  </svg>`;
}
document.getElementById('brandLogo').innerHTML=logoMark('#f2f2f2','#000',44);
function renderHeader(){
  document.getElementById('hSub').textContent=TIENDA.dir+(TIENDA.whatsapp?' · WhatsApp '+TIENDA.whatsapp:'');
}
renderHeader();
document.getElementById('btnConfig').onclick=async()=>{
  const w=await askInput({title:'Datos de la tienda',label:'WhatsApp (con lada, ej. 33 1234 5678)',value:TIENDA.whatsapp});
  if(w!==null)TIENDA.whatsapp=w.trim();
  const t=await askInput({title:'Datos de la tienda',label:'Teléfono (opcional)',value:TIENDA.tel});
  if(t!==null)TIENDA.tel=t.trim();
  await DB.saveConfig();renderHeader();toast('Datos de la tienda actualizados');
};
const money=n=>'$'+(Number(n)||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let notas=[];
let clientes=[];

// Reintenta operaciones de red ante fallos temporales de conexión
async function withRetry(fn,tries=3){
  let err;
  for(let i=0;i<tries;i++){
    try{return await fn();}catch(e){err=e;await new Promise(r=>setTimeout(r,500*(i+1)));}
  }
  throw err;
}
// ---- Capa de datos: local (localStorage) o nube (Supabase) ----
const DB={
  async all(){
    if(!CLOUD)return JSON.parse(localStorage.getItem(KEY)||'[]');
    const {data,error}=await sb.from('notas').select('*').order('creada',{ascending:false});
    if(error){toast('Error al cargar: '+error.message);return notas;}
    return data;
  },
  async insert(n){
    if(!CLOUD){notas.unshift(n);localStorage.setItem(KEY,JSON.stringify(notas));return;}
    // upsert = idempotente por id: si un reintento ocurre, no duplica
    await withRetry(async()=>{const {error}=await sb.from('notas').upsert(n);if(error)throw error;});
    if(!notas.some(x=>x.id===n.id))notas.unshift(n);
  },
  async update(n){
    if(!CLOUD){localStorage.setItem(KEY,JSON.stringify(notas));return;}
    await withRetry(async()=>{const {error}=await sb.from('notas').upsert(n);if(error)throw error;});
  },
  async remove(id){
    if(!CLOUD){notas=notas.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(notas));return;}
    const {error}=await sb.from('notas').delete().eq('id',id);
    if(error)throw error;
    notas=notas.filter(x=>x.id!==id);
  },
  async clientesAll(){
    if(!CLOUD)return JSON.parse(localStorage.getItem('bm_clientes_v1')||'[]');
    const {data,error}=await sb.from('clientes').select('*').order('nombre');
    if(error)return clientes;
    return data;
  },
  async clienteUpsert(c){
    if(!CLOUD){
      const arr=JSON.parse(localStorage.getItem('bm_clientes_v1')||'[]').filter(x=>x.id!==c.id);
      arr.push(c);localStorage.setItem('bm_clientes_v1',JSON.stringify(arr));return;
    }
    await withRetry(async()=>{const {error}=await sb.from('clientes').upsert(c);if(error)throw error;});
  },
  async loadConfig(){
    if(!CLOUD)return;
    const {data}=await sb.from('config').select('*').eq('id',1).maybeSingle();
    if(data){if(data.tel!=null)TIENDA.tel=data.tel;if(data.whatsapp!=null)TIENDA.whatsapp=data.whatsapp;}
  },
  async saveConfig(){
    if(!CLOUD){localStorage.setItem(CKEY,JSON.stringify({tel:TIENDA.tel,whatsapp:TIENDA.whatsapp}));return;}
    await sb.from('config').upsert({id:1,tel:TIENDA.tel,whatsapp:TIENDA.whatsapp});
  }
};

// ---- Navegación ----
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));

// ---- Formulario ----
const fTipo=document.getElementById('fTipo');
const itemsBody=document.getElementById('itemsBody');
document.getElementById('fFecha').valueAsDate=new Date();
document.getElementById('fPago').innerHTML=PAGOS.map(p=>`<option>${p}</option>`).join('');

function addItemRow(desc='',cant=1,precio=''){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><input class="i-desc up" value="${desc}"></td>
    <td><input class="i-cant" type="number" min="0" step="1" value="${cant}" style="width:70px"></td>
    <td><input class="i-precio" type="number" min="0" step="0.01" value="${precio}" style="width:100px"></td>
    <td class="i-importe">$0.00</td>
    <td><button class="btn sec sm i-del">✕</button></td>`;
  itemsBody.appendChild(tr);
  tr.querySelectorAll('input').forEach(i=>i.oninput=recalc);
  tr.querySelector('.i-del').onclick=()=>{tr.remove();recalc()};
  recalc();
}
document.getElementById('addItem').onclick=()=>addItemRow();

function recalc(){
  let total=0;
  itemsBody.querySelectorAll('tr').forEach(tr=>{
    const c=+tr.querySelector('.i-cant').value||0;
    const p=+tr.querySelector('.i-precio').value||0;
    const imp=c*p; total+=imp;
    tr.querySelector('.i-importe').textContent=money(imp);
  });
  document.getElementById('totalPreview').textContent=money(total);
  const ant=+document.getElementById('fAnticipo').value||0;
  document.getElementById('saldoPreview').textContent=money(total-ant);
  return total;
}
document.getElementById('fAnticipo').oninput=recalc;

fTipo.onchange=()=>{
  const t=fTipo.value;
  document.getElementById('grpTaller').classList.toggle('hidden',t!=='taller');
  document.getElementById('grpApartado').classList.toggle('hidden',t!=='apartado');
  document.getElementById('saldoLine').classList.toggle('hidden',t!=='apartado');
};

function limpiar(){
  document.getElementById('fCliente').value='';
  document.getElementById('fWa').value='';
  document.getElementById('fDomicilio').value='';
  document.getElementById('fPago').selectedIndex=0;
  document.getElementById('fBici').value='';
  document.getElementById('fRodado').value='';
  document.getElementById('fDetalles').value='';
  document.getElementById('fDiag').value='';
  document.getElementById('fObs').value='';
  document.getElementById('fAnticipo').value=0;
  document.getElementById('fEstado').value='proceso';
  itemsBody.innerHTML='';addItemRow();
}
document.getElementById('limpiar').onclick=limpiar;

document.getElementById('guardar').onclick=async()=>{
  const items=[...itemsBody.querySelectorAll('tr')].map(tr=>({
    desc:tr.querySelector('.i-desc').value.trim(),
    cant:+tr.querySelector('.i-cant').value||0,
    precio:+tr.querySelector('.i-precio').value||0
  })).filter(i=>i.desc);
  if(!document.getElementById('fCliente').value.trim()){toast('Ingresa el nombre del cliente.');return;}
  if(!items.length){toast('Agrega al menos un concepto.');return;}
  const tipo=fTipo.value;
  const total=items.reduce((s,i)=>s+i.cant*i.precio,0);
  const anticipo=tipo==='apartado'?(+document.getElementById('fAnticipo').value||0):0;
  const nota={
    id:uid(),
    folio:folio(tipo),
    tipo,
    fecha:document.getElementById('fFecha').value,
    cliente:document.getElementById('fCliente').value.trim(),
    wa:document.getElementById('fWa').value.trim(),
    domicilio:document.getElementById('fDomicilio').value.trim(),
    pago:document.getElementById('fPago').value,
    bici:document.getElementById('fBici').value.trim(),
    rodado:document.getElementById('fRodado').value.trim(),
    detalles:document.getElementById('fDetalles').value.trim(),
    diag:document.getElementById('fDiag').value.trim(),
    estado:document.getElementById('fEstado').value,
    items,total,anticipo,
    saldo:total-anticipo,
    obs:document.getElementById('fObs').value.trim(),
    creada:new Date().toISOString()
  };
  const btn=document.getElementById('guardar');btn.disabled=true;
  try{
    await DB.insert(nota);
    // Guardar/actualizar historial del cliente (si tiene WhatsApp)
    if(nota.wa&&digits(nota.wa)){
      const c={id:digits(nota.wa),nombre:nota.cliente,whatsapp:nota.wa,domicilio:nota.domicilio,creada:new Date().toISOString()};
      try{await DB.clienteUpsert(c);clientes=clientes.filter(x=>x.id!==c.id);clientes.push(c);}catch(_){}
      refreshClienteList();
    }
    toast('Nota '+nota.folio+' guardada.');
    limpiar();
    document.querySelector('.tabs button[data-view="lista"]').click();
  }catch(e){toast('Error al guardar: '+e.message);}
  btn.disabled=false;
};

function folio(tipo){
  const pref={venta:'V',apartado:'A',taller:'T'}[tipo];
  const n=notas.filter(x=>x.tipo===tipo).length+1;
  return pref+String(n).padStart(4,'0');
}

// ---- Dashboard ----
function renderDashboard(){
  document.getElementById('stTotal').textContent=notas.length;
  const ventas=notas.filter(n=>n.tipo==='venta').reduce((s,n)=>s+n.total,0);
  const ahora=new Date();
  const mesActual=ahora.getFullYear()+'-'+String(ahora.getMonth()+1).padStart(2,'0');
  const ventasMes=notas.filter(n=>n.tipo==='venta'&&(n.fecha||'').slice(0,7)===mesActual).reduce((s,n)=>s+n.total,0);
  document.getElementById('stVentasMes').textContent=money(ventasMes);
  document.getElementById('stMesNombre').textContent=ahora.toLocaleDateString('es-MX',{month:'long',year:'numeric'}).toUpperCase();
  const saldoAp=notas.filter(n=>n.tipo==='apartado').reduce((s,n)=>s+n.saldo,0);
  const tallerP=notas.filter(n=>n.tipo==='taller'&&n.estado==='proceso').length;
  document.getElementById('stVentas').textContent=money(ventas);
  document.getElementById('stApartados').textContent=money(saldoAp);
  document.getElementById('stTaller').textContent=tallerP;
  const r=document.getElementById('recientes');
  r.innerHTML=notas.slice(0,5).map(noteHTML).join('')||'<div class="empty">Aún no hay notas registradas.</div>';
  bindNoteClicks(r);
}

// ---- Lista ----
function renderLista(){
  const q=document.getElementById('buscar').value.toLowerCase();
  const ft=document.getElementById('filtroTipo').value;
  const el=document.getElementById('listaNotas');
  const filtered=notas.filter(n=>{
    if(ft&&n.tipo!==ft)return false;
    const hay=(n.cliente+' '+n.folio+' '+n.items.map(i=>i.desc).join(' ')).toLowerCase();
    return hay.includes(q);
  });
  el.innerHTML=filtered.map(noteHTML).join('')||'<div class="empty">Sin resultados.</div>';
  bindNoteClicks(el);
}
document.getElementById('buscar').oninput=renderLista;
document.getElementById('filtroTipo').onchange=renderLista;

// ---- Clientes (historial) ----
function refreshClienteList(){
  const dl=document.getElementById('clienteList');
  if(dl)dl.innerHTML=clientes.map(c=>`<option value="${(c.nombre||'').replace(/"/g,'')}">`).join('');
}
function renderClientes(){
  const q=document.getElementById('buscarCli').value.toLowerCase();
  const el=document.getElementById('listaClientes');
  const list=clientes.filter(c=>((c.nombre||'')+' '+(c.whatsapp||'')).toLowerCase().includes(q))
    .sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  el.innerHTML=list.map(c=>{
    const nn=notas.filter(n=>digits(n.wa)===c.id).length;
    return `<div class="note" data-cli="${(c.nombre||'').replace(/"/g,'&quot;')}">
      <div>
        <div><strong>${c.nombre||'—'}</strong></div>
        <div class="meta">${c.whatsapp?'WhatsApp: '+c.whatsapp:''}${c.domicilio?' · '+c.domicilio:''}</div>
        <div class="meta">${nn} nota(s)</div>
      </div>
      <div class="amt" style="font-size:14px">Ver historial ›</div>
    </div>`;
  }).join('')||'<div class="empty">Aún no hay clientes guardados. Se agregan solos al registrar notas con WhatsApp.</div>';
  el.querySelectorAll('.note').forEach(x=>x.onclick=()=>{
    document.querySelector('.tabs button[data-view="lista"]').click();
    document.getElementById('buscar').value=x.dataset.cli;
    renderLista();
  });
}
document.getElementById('buscarCli').oninput=renderClientes;

// Autocompletar datos del cliente al elegir uno existente
function autofillCliente(){
  const nombre=document.getElementById('fCliente').value.trim().toUpperCase();
  const wa=digits(document.getElementById('fWa').value);
  let c=null;
  if(wa)c=clientes.find(x=>x.id===wa);
  if(!c&&nombre)c=clientes.find(x=>(x.nombre||'').toUpperCase()===nombre);
  if(!c)return;
  if(!document.getElementById('fWa').value.trim()&&c.whatsapp)document.getElementById('fWa').value=c.whatsapp;
  if(!document.getElementById('fDomicilio').value.trim()&&c.domicilio)document.getElementById('fDomicilio').value=c.domicilio;
  if(c.nombre)document.getElementById('fCliente').value=c.nombre;
}
document.getElementById('fCliente').addEventListener('change',autofillCliente);
document.getElementById('fWa').addEventListener('change',autofillCliente);

function noteHTML(n){
  const estado=n.tipo==='apartado'?(n.saldo<=0?'pagado':'pendiente'):(n.tipo==='taller'?n.estado:'');
  const estBadge=estado?`<span class="badge ${estado}">${estado==='proceso'?'en proceso':estado}</span>`:'';
  const amt=n.tipo==='apartado'?`<div class="amt">${money(n.saldo)}<div class="muted" style="font-size:11px">saldo de ${money(n.total)}</div></div>`:`<div class="amt">${money(n.total)}</div>`;
  return `<div class="note" data-id="${n.id}">
    <div>
      <div><span class="badge ${n.tipo}">${n.tipo}</span> <strong>${n.folio}</strong> ${estBadge}</div>
      <div class="meta">${n.cliente}${n.bici?' · '+n.bici:''}</div>
      <div class="meta">${n.fecha}</div>
    </div>
    ${amt}
  </div>`;
}

function bindNoteClicks(container){
  container.querySelectorAll('.note').forEach(el=>el.onclick=()=>abrirDetalle(el.dataset.id));
}

const tipoLabel={venta:'Nota de venta',apartado:'Nota de apartado',taller:'Nota de taller'};
function abrirDetalle(id){
  const n=notas.find(x=>x.id===id);if(!n)return;
  const rows=n.items.map(i=>`<tr><td>${i.desc}</td><td class="num">${i.cant}</td><td class="num">${money(i.precio)}</td><td class="num">${money(i.cant*i.precio)}</td></tr>`).join('');
  const contactoCli=[n.wa?'WhatsApp: '+n.wa:'',n.domicilio?'Dom: '+n.domicilio:''].filter(Boolean).join('<br>');
  const biciTxt=[n.bici,n.rodado?'R'+n.rodado:''].filter(Boolean).join(' · ');
  const infoBlocks=`
    <div><b>Cliente</b>${n.cliente||'—'}${contactoCli?'<br>'+contactoCli:''}</div>
    ${biciTxt?`<div><b>Bicicleta</b>${biciTxt}</div>`:''}
    <div style="text-align:right"><b>Fecha</b>${n.fecha}${n.pago?'<br><b>Pago</b>'+n.pago:''}</div>`;
  const totales=`
    <div class="r-totals">
      <div><span>Total</span><span>${money(n.total)}</span></div>
      ${n.tipo==='apartado'?`<div><span>Anticipo / abonos</span><span>${money(n.anticipo)}</span></div>
      <div class="r-saldo"><span>Saldo pendiente</span><span>${money(n.saldo)}</span></div>`:''}
      <div class="r-grand"><span>${n.tipo==='apartado'?'A pagar':'Total'}</span><span>${money(n.tipo==='apartado'?n.saldo:n.total)}</span></div>
    </div>`;
  document.getElementById('dlgBody').innerHTML=`
    <div class="r-head">
      <div class="r-brand">
        ${logoMark('#1a1a1a','#fff',54)}
        <div>
          <div class="r-name">BLACK MACHINE<br>BIKE SHOP</div>
          <div class="r-sub">${TIENDA.dir}${TIENDA.tel?' · Tel '+TIENDA.tel:''}${TIENDA.whatsapp?' · WhatsApp '+TIENDA.whatsapp:''}</div>
        </div>
      </div>
      <div class="r-doc">
        <div class="r-type">${tipoLabel[n.tipo]}</div>
        <div class="r-folio">${n.folio}</div>
        <div class="r-date">${n.fecha}</div>
      </div>
    </div>
    <div class="r-info">${infoBlocks}</div>
    ${n.detalles?`<div style="font-size:12px;margin-bottom:8px"><b style="color:#666;font-size:10px;text-transform:uppercase">Detalles al recibir</b><br>${n.detalles}</div>`:''}
    ${n.diag?`<div style="font-size:12px;margin-bottom:8px"><b style="color:#666;font-size:10px;text-transform:uppercase">Servicio</b><br>${n.diag}${n.tipo==='taller'?' · Estado: '+(n.estado==='proceso'?'En proceso':'Entregado'):''}</div>`:''}
    <table class="r-items"><thead><tr><th>Descripción</th><th class="num">Cant.</th><th class="num">P. Unitario</th><th class="num">Importe</th></tr></thead><tbody>${rows}</tbody></table>
    ${totales}
    <div class="r-foot">
      <div>${n.obs?'<b>Observaciones:</b> '+n.obs+'<br>':''}Gracias por su preferencia. Conserve esta nota para cualquier aclaración o garantía.</div>
      <div class="r-sign"><div class="line">Firma / recibí conforme</div></div>
    </div>`;
  document.getElementById('dlgActions').innerHTML=`
    ${n.tipo==='apartado'&&n.saldo>0?'<button class="btn sm" id="abonar">Registrar abono</button>':''}
    ${n.tipo==='taller'&&n.estado==='proceso'?'<button class="btn sm" id="entregar">Marcar entregado</button>':''}
    ${n.wa?`<button class="btn sm" id="waCli" style="background:#25D366">WhatsApp cliente</button>`:''}
    <button class="btn sm" id="compartir" style="background:#0a7">Compartir / Enviar</button>
    <button class="btn sec sm" id="imprimir">Imprimir / PDF</button>
    <button class="btn sec sm" id="borrar">Eliminar</button>
    <button class="btn sec sm" onclick="document.getElementById('dlg').close()">Cerrar</button>`;
  document.getElementById('dlg').showModal();
  document.getElementById('imprimir').onclick=()=>{
    document.getElementById('printArea').innerHTML=document.getElementById('dlgBody').innerHTML;
    window.print();
  };
  document.getElementById('compartir').onclick=async()=>{
    if(!window.jspdf||!window.html2canvas){toast('Cargando… intenta de nuevo en un momento.');return;}
    toast('Generando PDF…');
    try{
      const holder=document.createElement('div');
      holder.className='receipt';
      holder.style.cssText='position:fixed;left:-9999px;top:0;width:720px;background:#fff';
      holder.innerHTML=document.getElementById('dlgBody').innerHTML;
      document.body.appendChild(holder);
      const canvas=await html2canvas(holder,{scale:2,backgroundColor:'#ffffff'});
      document.body.removeChild(holder);
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF('p','mm','a4');
      const w=210,h=canvas.height*w/canvas.width;
      pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',0,0,w,h);
      const nombre=(n.folio||'nota')+'_'+(n.cliente||'').replace(/\s+/g,'_')+'.pdf';
      const blob=pdf.output('blob');
      const file=new File([blob],nombre,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'Nota '+n.folio,text:tipoLabel[n.tipo]+' '+n.folio+' · '+TIENDA.nombre});
      }else{
        pdf.save(nombre);
      }
    }catch(e){if(e.name!=='AbortError')toast('No se pudo generar el PDF: '+e.message);}
  };
  const ab=document.getElementById('abonar');
  if(ab)ab.onclick=async()=>{
    const r=await askInput({title:'Registrar abono',label:'Monto del abono (saldo actual '+money(n.saldo)+')',type:'number',value:'',ok:'Abonar'});
    if(r===null)return;
    const v=parseFloat(r);
    if(!(v>0)){toast('Ingresa un monto válido.');return;}
    n.anticipo+=v;n.saldo=Math.max(0,n.total-n.anticipo);
    try{await DB.update(n);}catch(e){toast('Error: '+e.message);return;}
    document.getElementById('dlg').close();refresh();
    toast('Abono de '+money(v)+' registrado.');
  };
  const en=document.getElementById('entregar');
  if(en)en.onclick=async()=>{n.estado='entregado';try{await DB.update(n);}catch(e){toast('Error: '+e.message);return;}document.getElementById('dlg').close();refresh();};
  const wc=document.getElementById('waCli');
  if(wc)wc.onclick=()=>{
    const monto=n.tipo==='apartado'?`Saldo pendiente: ${money(n.saldo)} (de ${money(n.total)})`:`Total: ${money(n.total)}`;
    const msg=`Hola ${n.cliente}, gracias por tu preferencia en ${TIENDA.nombre}.\n${tipoLabel[n.tipo]} ${n.folio}\n${monto}\nPago: ${n.pago||'—'}`;
    window.open(waLink(n.wa)+'?text='+encodeURIComponent(msg),'_blank');
  };
  document.getElementById('borrar').onclick=async()=>{
    if(await confirmModal('¿Eliminar la nota '+n.folio+'? Esta acción no se puede deshacer.')){
      try{await DB.remove(id);}catch(e){toast('Error: '+e.message);return;}
      document.getElementById('dlg').close();refresh();toast('Nota eliminada.');
    }
  };
}

function refresh(){renderDashboard();renderLista();}

// ---- Exportar CSV ----
document.getElementById('exportar').onclick=()=>{
  const head=['Folio','Tipo','Fecha','Cliente','WhatsApp','Domicilio','MetodoPago','Bicicleta','Rodado','Detalles','Total','Anticipo','Saldo','Estado','Conceptos'];
  const rows=notas.map(n=>[n.folio,n.tipo,n.fecha,n.cliente,n.wa||'',n.domicilio||'',n.pago||'',n.bici||'',n.rodado||'',n.detalles||'',n.total,n.anticipo,n.saldo,n.estado,
    n.items.map(i=>`${i.cant}x ${i.desc} (${i.precio})`).join(' | ')]
    .map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(','));
  const csv=[head.join(','),...rows].join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='notas_black_machine.csv';a.click();
};

// ---- Arranque, login y sincronización ----
async function startApp(){
  document.getElementById('auth').classList.add('hidden');
  if(CLOUD)document.getElementById('btnLogout').classList.remove('hidden');
  await DB.loadConfig();
  renderHeader();
  notas=await DB.all();
  clientes=await DB.clientesAll();
  refreshClienteList();
  refresh();
  if(CLOUD){
    sb.channel('notas-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'notas'},async()=>{notas=await DB.all();refresh();})
      .on('postgres_changes',{event:'*',schema:'public',table:'clientes'},async()=>{clientes=await DB.clientesAll();refreshClienteList();})
      .subscribe();
  }
}
async function boot(){
  addItemRow();
  document.getElementById('authLogo').innerHTML=logoMark('#f2f2f2','#1a1a1a',64);
  if(!CLOUD){await startApp();return;}
  const {data:{session}}=await sb.auth.getSession();
  if(session){await startApp();}
  else{document.getElementById('auth').classList.remove('hidden');}
}
const doLogin=async()=>{
  const email=document.getElementById('authEmail').value.trim();
  const pass=document.getElementById('authPass').value;
  const err=document.getElementById('authErr');err.textContent='';
  const btn=document.getElementById('authBtn');btn.disabled=true;
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  btn.disabled=false;
  if(error){err.textContent='Correo o contraseña incorrectos.';return;}
  await startApp();
};
document.getElementById('authBtn').onclick=doLogin;
document.getElementById('authPass').onkeydown=e=>{if(e.key==='Enter')doLogin();};
document.getElementById('btnLogout').onclick=async()=>{await sb.auth.signOut();location.reload();};
boot();
</script>
